<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 旅行打包魔法</title><style>*{box-sizing:border-box}body{margin:0;background:#211438;color:#fff;font:20px system-ui,sans-serif}main{max-width:650px;margin:auto;padding:24px}h1{color:#f5d48b;font-size:32px}img{width:100%;height:auto;border-radius:12px}label{display:block;margin:20px 0 8px}input,select,textarea,button,a.action{width:100%;font:inherit;padding:14px;border-radius:12px;border:1px solid #bda4dd}textarea{min-height:100px}#result{min-height:260px}button,a.action{display:block;background:#f5d48b;color:#302047;margin-top:12px;text-align:center;text-decoration:none;cursor:pointer;font-weight:bold}small{font-size:16px}#status{min-height:28px;color:#f5d48b}</style></head><body><main><small>卡卡的 AI 魔法學院 · No.002</small><h1>✦ AI 旅行打包魔法</h1><img src="academy-banner.webp" alt="卡卡的 AI 魔法學院" onerror="this.hidden=true"><p>選擇旅行需求，讓 AI 幫你整理專屬行李清單！</p><label for="dest">① 旅行目的地</label><input id="dest" placeholder="例如：日本東京" value="日本東京"><label for="days">② 旅行天數</label><input id="days" type="number" min="1" step="1" value="5"><label for="season">③ 旅行季節</label><select id="season"><option>春季</option><option>夏季</option><option>秋季</option><option selected>冬季</option><option>不確定，請提醒我查詢</option></select><label for="kind">④ 旅行類型</label><select id="kind"><option>自由行綜合行程</option><option>跟團旅遊</option><option>城市觀光與購物</option><option>戶外健行</option><option>海島度假</option><option>商務旅行</option><option>其他（請於下方補充）</option></select><label for="bag">⑤ 行李方式</label><select id="bag"><option>一般托運行李＋隨身包</option><option>僅隨身行李</option><option>背包旅行</option><option>尚未確定</option></select><label for="extra">⑥ 其他需求（選填）</label><textarea id="extra" placeholder="例如：住宿可洗衣、需要拍照設備"></textarea><button id="make">✨ 產生魔法提示詞</button><label for="result">你的專屬魔法提示詞</label><textarea id="result" readonly></textarea><button id="copy">複製提示詞</button><div id="status" role="status"></div><a class="action" href="https://chatgpt.com/" target="_blank" rel="noopener">前往 ChatGPT</a><p><small>請將提示詞貼到 ChatGPT。實際天氣、入境及行李規定請向官方確認。只要想學，永遠不嫌晚。</small></p></main><script>const el=id=>document.getElementById(id);function make(){const d=el('dest').value.trim(),n=Number(el('days').value);if(!d||!Number.isInteger(n)||n<1){el('status').textContent='請填寫目的地及有效旅行天數。';el('result').value='';return false}el('result').value=`你是我的專業旅行行李打包助手。我要前往${d}旅行${n}天，季節為${el('season').value}，旅行類型為${el('kind').value}，行李方式為${el('bag').value}。${el('extra').value.trim()?'其他需求：'+el('extra').value.trim()+'。':''}請依旅行文件、衣物、盥洗保養、電子用品、個人常備用品及其他物品分類，提供建議攜帶數量，區分必帶與選帶，並製作出發前可勾選的檢查清單。提醒我需要向航空公司或官方確認的行李限制，不要自行假設規定、天氣或個人用藥需求。若資料不足，請先詢問我。請使用繁體中文台灣用語，簡單清楚。`;el('status').textContent='提示詞已產生。';return true}el('make').onclick=make;el('copy').onclick=async()=>{if(!make())return;try{await navigator.clipboard.writeText(el('result').value);el('status').textContent='已複製！'}catch{el('result').focus();el('result').select();el('status').textContent='請手動複製選取的文字。'}};make();</script></body></html>
