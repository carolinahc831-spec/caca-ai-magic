<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No.003｜AI 菜單翻譯魔法</title><style>*{box-sizing:border-box}body{margin:0;background:#211438;color:#fff;font:20px/1.6 system-ui,sans-serif}main{max-width:650px;margin:auto;padding:24px}h1{color:#f5d48b;font-size:32px;line-height:1.3}img{width:100%;height:auto;border-radius:12px}label{display:block;margin:20px 0 8px}input,select,textarea,button,a.action{width:100%;font:inherit;padding:14px;border-radius:12px;border:1px solid #bda4dd}textarea{min-height:100px}#result{min-height:310px}button,a.action{display:block;background:#f5d48b;color:#302047;margin-top:12px;text-align:center;text-decoration:none;cursor:pointer;font-weight:bold}small{font-size:16px}#status{min-height:28px;color:#f5d48b}.guide{border:1px solid #bda4dd;border-radius:12px;padding:16px;background:#302047}ol{padding-left:1.5em}fieldset{border:1px solid #bda4dd;border-radius:12px;margin:20px 0;padding:12px}fieldset label{margin:8px 0;display:flex;align-items:center;gap:12px}input[type=checkbox]{width:24px;height:24px;flex:none}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f5d48b;outline-offset:3px}</style></head><body><main><small>卡卡的 AI 魔法學院 · No.003</small><h1>✦ AI 菜單翻譯魔法</h1><img src="academy-banner.webp" alt="卡卡的 AI 魔法學院" onerror="this.hidden=true"><p>看不懂外國菜單？讓 AI 幫你看懂菜名、特色與價格，輕鬆開口點餐！</p><div class="guide"><strong>三步驟學會菜單翻譯</strong><ol><li>用手機清楚拍下菜單文字與價格。</li><li>選擇下方需求，產生並複製提示詞。</li><li>前往 ChatGPT，上傳菜單照片，再貼上提示詞送出。</li></ol></div><label for="country">① 旅行國家或地區</label><input id="country" value="日本" placeholder="例如：日本東京"><label for="lang">② 菜單語言／點餐語言</label><select id="lang"><option>日文</option><option>英文</option><option>韓文</option><option>法文</option><option>義大利文</option><option>泰文</option><option>西班牙文</option><option>德文</option><option>其他或不確定（請 AI 辨識並確認）</option></select><label for="diet">③ 飲食需求</label><select id="diet"><option>無特殊需求</option><option>全素</option><option>蛋奶素</option><option>不吃牛肉</option><option>不吃豬肉</option><option>不吃海鮮</option><option>食物過敏或其他限制（請於下方補充）</option></select><fieldset><legend>④ 想請 AI 幫忙的項目</legend><label><input type="checkbox" value="翻譯菜名與菜色特色" checked>翻譯菜名與特色</label><label><input type="checkbox" value="整理菜單標示的價格與幣別" checked>整理價格</label><label><input type="checkbox" value="辨識菜單明示的食材，標出需向店家確認之處" checked>辨識食材</label><label><input type="checkbox" value="依我的需求推薦菜單中可辨識的餐點，說明理由" checked>推薦餐點</label><label><input type="checkbox" value="提供當地語言點餐句子、繁中對照及簡易發音" checked>點餐句子與發音</label></fieldset><label for="extra">⑤ 其他需求（選填）</label><textarea id="extra" placeholder="例如：兩人用餐、預算每人1500日圓、想確認是否含花生"></textarea><button id="make" type="button">✨ 產生魔法提示詞</button><label for="result">你的專屬魔法提示詞</label><textarea id="result" readonly></textarea><button id="copy" type="button">複製提示詞</button><div id="status" role="status" aria-live="polite"></div><a class="action" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">前往 ChatGPT</a><p><small>提醒：本網頁只產生提示詞，不會上傳或翻譯照片。請在 ChatGPT 另外上傳菜單。食材、過敏原、交叉接觸及實際價格務必向店家確認。圖片上傳功能依帳號與使用額度而定。</small></p><p><small>卡卡的 AI 魔法學院｜一起練習・一起進步・不怕不完美！</small></p></main><script>const el=id=>document.getElementById(id);function make(){const country=el('country').value.trim(),diet=el('diet').value,extra=el('extra').value.trim(),tasks=[...document.querySelectorAll('fieldset input:checked')].map(x=>x.value);if(!country||!tasks.length||(diet.startsWith('食物過敏')&&!extra)){el('result').value='';el('status').textContent='請填寫旅行地區、至少選擇一項任務，並補充特殊飲食限制（如適用）。';return false}el('result').value=`你是我的專業旅行菜單翻譯助手。旅行地區：${country}。菜單／點餐語言：${el('lang').value}。飲食需求：${diet}。${extra?'其他需求：'+extra+'。':''}\n請根據我上傳的菜單照片，完成以下任務：\n${tasks.map((t,i)=>`${i+1}. ${t}`).join('\n')}\n請使用繁體中文台灣用語，簡單清楚，保留原文菜名方便對照。只依照片可辨識的內容回答，不自行猜測模糊文字、食材、過敏原、價格或幣別；不確定的地方請標示並提供向店家確認的方式。若沒有收到照片，請先提醒我上傳；若資訊不足，請先詢問我。涉及飲食限制或過敏時，提醒我必須向店家確認食材及交叉接觸風險，不保證餐點安全。`;el('status').textContent='提示詞已產生。';return true}el('make').onclick=make;el('copy').onclick=async()=>{if(!make())return;try{await navigator.clipboard.writeText(el('result').value);el('status').textContent='已複製！請前往 ChatGPT 上傳菜單並貼上提示詞。'}catch{el('result').focus();el('result').select();el('status').textContent='請手動複製選取的文字。'}};make();</script></body></html>
